<!doctype html><html lang="pl"><head><meta charset="utf-8"><title>Widget mock</title>
<style>body{font-family:system-ui;margin:0;padding:24px;background:#fafafa}#booking{max-width:560px}</style>
</head><body>
<div id="booking"></div>
<script src="/dist/widget.js"></script>
<script>
  // ?prefillClass=41 / ?prefillSession=901 emulate a timetable CTA on a customer
  // site handing the widget what the visitor already clicked.
  var q = new URLSearchParams(location.search);
  var prefill = {};
  if (q.get('prefillClass')) prefill.classId = Number(q.get('prefillClass'));
  if (q.get('prefillSession')) prefill.sessionId = Number(q.get('prefillSession'));
  if (q.get('prefillService')) prefill.serviceId = Number(q.get('prefillService'));
  VizytoBooking.mount({
    businessId: 24, siteKey: 'pk_test', apiBase: 'mock', inline: '#booking',
    prefill: Object.keys(prefill).length ? prefill : undefined,
  });
</script>
</body></html>
